# RSS 기사에는 종목 정보가 없으므로, 제목·요약에 alias가 있으면 해당 종목으로 태깅한다.
# title_only: true 이면 제목에 alias가 있을 때만 태깅한다. (요약에 "네이버"가 지나가듯 나오는 기사가 많아서)
# alias가 너무 일반적이면(예: "네이버") 노이즈가 생긴다. 실제 결과를 보고 조정할 것.
stocks:
  "005930": { name: 삼성전자, aliases: ["삼성전자", "삼전"] }
  "000660": { name: SK하이닉스, aliases: ["SK하이닉스", "하이닉스", "삼전닉스"] }
  "035420": { name: NAVER, aliases: ["네이버", "NAVER"], title_only: true }
  "105560": { name: KB금융지주, aliases: ["KB금융", "KB금융지주"] }
