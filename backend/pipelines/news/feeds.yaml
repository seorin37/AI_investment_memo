# 4개 매체 RSS 피드 (각 매체의 전체뉴스 피드 1개씩).
# 섹션별 피드를 따로 받으면 같은 기사가 중복되므로 전체뉴스만 사용한다.
# verified: true = 서린이 확인한 주소
#
# 참고: 전체뉴스 피드는 한 번에 담는 기사 수가 제한돼 있을 수 있다.
# 1시간 동안 올라오는 기사가 그 수보다 많으면 일부를 놓친다. 첫 실행 때 응답의 기사 수를 확인할 것.

hankyung:
  code: hankyung   # news_sources.code (DB의 기존 값에 맞춤)
  publisher: 한국경제
  feeds:
    - { section: 전체뉴스, url: "https://www.hankyung.com/feed/all-news", verified: true }

mk:
  code: mk
  publisher: 매일경제
  feeds:
    - { section: 전체뉴스, url: "https://www.mk.co.kr/rss/40300001/", verified: true }

sedaily:
  code: sedaily
  publisher: 서울경제
  feeds:
    - { section: 전체뉴스, url: "https://www.sedaily.com/rss/newsall", verified: true }

yonhap:
  code: yonhap
  publisher: 연합뉴스
  # 주의: yonhapnewstv.co.kr 은 연합뉴스TV(별도 매체)이므로 사용하지 않는다.
  feeds:
    - { section: 전체뉴스, url: "https://www.yna.co.kr/rss/news.xml", verified: true }
