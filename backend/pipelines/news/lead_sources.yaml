# 뉴스 리드(첫 문단) 보충 설정 — lead_fetcher.py
# RSS 요약이 없거나 40자 미만인 기사만 대상이다. 리드는 임베딩 입력에만 쓰고 화면·LLM 근거에는 쓰지 않는다.
#
# method
#   link  : 기사 링크에 들어가 본문 칸(selector)의 첫 2~3문장(최대 lead_max_chars자)을 가져온다
#   naver : 네이버 검색 API에서 originallink가 같은 결과의 description을 가져온다 (크롤링 아님)
# enabled: false 이면 그 매체 기사는 보충하지 않는다 (리드 행을 만들지 않으므로 임베딩도 기다리지 않는다).
# selector: null 이면 enabled여도 요청을 보내지 않는다. 실제 기사 HTML을 보고 확정한 뒤 채운다.
#
# 2026-10-27: 실제 수집 전이라 전부 꺼 둠. 켜기 전 대표님께 뉴스 이용 근거를 확인한다.
#   서울경제는 약관(제11조)이 크롤링을 명시적으로 금지해 link 대신 naver를 쓴다.
# 2026-11-06 팀 재결정: 서울경제 이용약관 제11조의 크롤링 금지 조항을 인지한 상태에서,
#   비상업적 교육 프로젝트 범위에 한해 원문 수집을 진행한다.
#   - 원문은 내부 검색·요약 근거로만 사용하고 사용자 화면에 원문을 노출하지 않는다.
#   - 외부 배포·상업적 이용 전에는 이용 허락을 받거나 수집을 중단하고 저장된 원문을 삭제한다.
#   그래서 서울경제를 link 방식으로 바꾸고 fallback: naver를 둔다. selector는 --probe로 확정하기 전까지 null이라
#   그동안은 지금처럼 naver 요약으로 보충한다.
#
# fulltext_enabled: link 방식 매체가 원문 페이지를 요청할지 (기본 true). false면 원문을 요청하지 않는다(--probe 포함).
#   fallback: naver가 있으면 naver 요약 방식으로 돌아가고, 없으면 그 매체는 보충하지 않는다.
#   서울경제는 이 값 하나만 false로 바꾸면 원문 수집이 멈추고 naver 요약 방식으로 돌아간다.
# fallback: 원문을 쓸 수 없을 때(fulltext_enabled: false 또는 selector가 null) 쓸 방식. 비우거나 naver
# domains: 도메인과 그 서브도메인. "www.mk.co.kr"처럼 www를 붙여 적으면 그 호스트만 받는다
# url_patterns: 있으면 URL 경로(쿼리 제외)가 이 정규식 중 하나와 맞는 기사만 원문을 받는다 (실제 수집·--probe·--from-naver 모두)
# probe_selectors: --probe가 공통 후보보다 먼저 보는 그 매체의 후보 selector (확정 전 후보, 실제 수집에는 안 쓴다)
# subtitle_selector: 부제목 칸. 본문에서 빼려면 drop_selectors에도 같이 적는다 (--report의 subtitle 칸, 나중에 DB subtitle 필드)
# paywall_selectors + paywall_text: 이 칸 중 글에 paywall_text(정규식)가 있는 칸을 본문에서 빼고 유료 기사로 표시한다
#   (--report의 is_paywalled 칸). 건너뛸 때 걸린 칸과 문구 앞 60자를 error(리드 테이블 last_error, report.csv)와 로그에 남긴다
# drop_text_patterns: 글이 이 정규식으로 시작하는 문단(p·li)을 통째로 지운다 (관련 기사 링크 줄 등)
# skip_section_patterns / skip_title_patterns: 페이지 meta article:section / 제목(RSS 제목, 페이지 og:title)이 맞으면
#   skipped("모음 기사 …")로 끝낸다. RSS 제목으로 알 수 있으면 요청하지 않는다
# skip_paywalled: true면 유료 기사는 저장하지 않고 skipped로 끝낸다 (실제 수집·--probe 모두). false면 받은 본문을 저장한다

request_interval_seconds: 4   # 같은 매체에 보내는 요청 사이 최소 간격
max_attempts: 3               # 일시 오류(5xx·타임아웃·검색 결과 없음) 재시도 횟수. 넘으면 failed
lead_max_chars: 300
lead_min_chars: 40            # 이보다 짧게 뽑히면 추출 실패로 본다 (선택자 깨짐·사진 기사)
enqueue_days: 3               # 최근 며칠 발행분만 보충 대상으로 올린다
contact: ""                   # User-Agent 뒤에 붙일 연락처 (예: 팀 메일). 비워 두면 생략

sources:
  hankyung:
    method: link
    enabled: true
    fulltext_enabled: true
    domains: [hankyung.com]
    selector: "div.article-body"
    drop_selectors: []        # 본문 칸 안에서 지울 요소 (사진 설명·관련 기사 등)
    # 2026-11-06 유료 기사 안내: div.box-cont("한경 프리미엄9에 실린 기사입니다…"), blockquote("…유료 프리미엄…").
    #   div.box-cont는 [편집자주]·연재 꼬리말에도 쓰여(hankyung_1) 통째로 지우지 않고, 글에 paywall_text가 있는 칸만
    #   유료 기사로 본다. 편집자주·연재 꼬리말은 이번엔 처리하지 않는다
    paywall_selectors: ["div.box-cont", "blockquote"]
    paywall_text: "유료|프리미엄"
    # 2026-11-06 팀 결정: 유료·프리미엄 기사는 빼고 무료 기사만 받는다. 유료인지는 페이지를 받아 봐야 알 수 있어
    #   요청은 한 번 가지만 저장하지 않고 skipped로 끝낸다 (false로 바꾸면 안내 문구만 빼고 받은 본문을 저장)
    skip_paywalled: true
  mk:
    method: link
    enabled: true
    fulltext_enabled: true
    domains: [www.mk.co.kr]   # 2026-11-06 mk.co.kr → www만: mbn.mk.co.kr(MBN 방송)은 페이지 구조가 달라 본문 추출 실패
    # 2026-11-06 div.news_cnt_detail_wrap → [itemprop='articleBody']: 본문 구조가 두 가지라(news_cnt_detail_wrap 8건,
    #   div.article_body 2건) 기존 칸은 8/10, itemprop은 10/10 (probe 10건)
    selector: "[itemprop='articleBody']"
    # 2026-11-06 div.mid_title(여러 줄 부제목 박스)는 본문에서 빼고 subtitle로 따로 뽑는다
    # 2026-11-06 div.article-summary-box("💡 핵심요약 쏙" 요약 박스, article_body 구조 본문 맨 앞)도 뺀다
    drop_selectors: ["div.mid_title", "div.article-summary-box"]
    subtitle_selector: "div.mid_title"
  yonhap:
    method: link              # 요약이 40자 미만인 일부 기사만 해당
    enabled: true
    # 2026-11-06 확인: 연합뉴스 기사 하단 저작권 문구에 'AI 학습 및 활용 금지'가 있음.
    #   팀 결정: 서울경제와 같은 범위(비상업적 교육 프로젝트, 원문은 내부 검색·요약 근거로만 사용하고 화면에 노출하지 않음,
    #   외부 배포·상업적 이용 전 이용 허락을 받거나 수집 중단·원문 삭제)로 4개 매체 모두 원문 수집·임베딩을 진행한다.
    fulltext_enabled: true
    fallback: naver           # 2026-11-06 추가: fulltext_enabled: false로 끄면 naver 요약으로 돌아간다
    domains: [yna.co.kr]
    # 2026-11-06 일반 기사(/view/AKR…)만 받는다. 사진 기사(/view/PYH…)는 본문 115~156자에 잡음이 45%였다 (probe 10건 중 9건)
    url_patterns: ['^/view/AKR']
    selector: "div.story-news"
    # 2026-11-06 div.writer-zone01 추가: 기자 영역(div.txt-con)을 감싸는 칸. 구조가 다른 기사에서 기자명·구독 버튼이 남지 않게
    drop_selectors: ["div.txt-con", "div.tit-sub", "div.tit-con", "p.txt-copyright", "span.date", "button", "span.ir-txt01",
                     "div.writer-zone01"]
    # 2026-11-06 모음 기사는 건너뛴다: 신문 1면 톱뉴스·사설 모음("▲ 내일신문 = …"). probe 10건 중 2건, 둘 다 섹션이
    #   '뉴스편집'이고 제목이 '[전국 주요 신문 …'. 일반 기사 8건은 해당 없음. 인사·부고·날씨는 샘플에 없어 아직 넣지 않았다
    skip_section_patterns: ['^뉴스편집$']
    skip_title_patterns: ['^\[전국 주요 신문']
  sedaily:
    method: link              # 2026-11-06 naver → link (위 팀 재결정). 원문을 멈추려면 fulltext_enabled: false
    enabled: true
    fulltext_enabled: true
    fallback: naver           # selector 확정 전이거나 fulltext_enabled: false일 때 쓰는 기존 방식
    domains: [sedaily.com]
    selector: null            # --probe 결과를 확인한 뒤 채운다. null인 동안 원문을 요청하지 않는다 (naver로 보충)
    # 2026-11-06 미검증 후보 probe_selectors(div.article_view, div.article_con, #v-left-scroll-in)는 probe 0/10이라 지웠다.
    #   #article-body가 10/10 (selector는 팀이 확인 후 채운다)
    # 2026-11-06 div.article-video(관련 영상 제목) 제거, "▶기사 바로가기"로 시작하는 문단(관련 기사 링크) 제거
    drop_selectors: ["div.article-video"]
    drop_text_patterns: ['^▶\s*기사\s*바로가기']
