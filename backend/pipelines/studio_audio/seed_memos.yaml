# AI 오디오 시험용 메모 (2026-11-23). 가상의 사용자 1명이 일주일 동안 4종목에 남긴 메모.
# day: 기간 첫날(start)로부터 며칠째에 썼는지 (0 = 첫날). 그날 21시(한국 시간)에 쓴 것으로 날짜를 소급한다.
# hold: 보유 | 관심 (user_stocks.status). 가격 조건은 지금 시세를 모르고 쓰면 확인 질문으로 빠지므로 넣지 않았다.
stocks:
