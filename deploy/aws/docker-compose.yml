# AWS용: db + api + caddy. 실행 위치: deploy/aws/
#   docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memos-aws-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 서버 자신(127.0.0.1)에서만 열린다. 강의실 PC는 SSH 터널로 접속.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile.api
    container_name: memos-aws-api
    restart: unless-stopped
    # 강의실 PC의 .env를 복사해 둔 파일 (OpenAI 키, JWT 시크릿 등)
    env_file:
      - ../../.env
    # .env 안의 DB 주소(192.168.0.105 등)를 AWS DB로 덮어쓴다
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      READONLY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2
    container_name: memos-aws-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
