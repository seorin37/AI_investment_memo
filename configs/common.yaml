# DART 정기보고서 임베딩 파이프라인 공통 설정 (dense·hybrid 모드 공통)
# 상대 경로는 저장소 루트 기준이다.

targets:
  # 대상 종목 목록은 backend/app/targets.py의 TARGET_SYMBOLS를 쓴다. 여기서는 청크 헤더용 기업명만 둔다.
  companies:
    "005930": 삼성전자
    "000660": SK하이닉스
    "035420": NAVER
    "105560": KB금융
  # 기업별 대상 기간(period_end). 제출일이 아니라 대상 기간으로 고른다.
  periods:
    - "2024-03-31"
    - "2024-06-30"
    - "2024-09-30"
    - "2024-12-31"
    - "2025-03-31"
    - "2025-06-30"
    - "2025-09-30"
    - "2025-12-31"
    - "2026-03-31"
    - "2026-06-30"

dart:
  request_interval_sec: 0.2
  max_attempts: 3
  backoff_base_sec: 1.0
  corp_code_cache_days: 7
  # 목록 조회 시작일. 2024 1분기보고서(2024-05 제출)부터 포함되며, 2023 사업보고서는 기간으로 걸러낸다.
  list_bgn_de: "20240101"

paths:
  raw_dir: data/raw/dart
  parsed_dir: data/parsed
  chunks_dir: data/chunks
  logs_dir: logs
  # 재무 API 원본 응답 JSON (run_financials, WO-015)
  financials_raw_dir: data/raw/dart/financials
  shares_raw_dir: data/raw/dart/shares
  # 재무 적재 산출물: provenance.jsonl (컬럼별 출처)
  financials_dir: data/financials

model:
  name: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  use_fp16: true
  devices: ["cuda:0"]   # 멀티 GPU는 지원하지 않는다. 첫 장치만 쓴다.
  max_length: 1024
  query_max_length: 512
  batch_size: 16        # 6GB GPU 실측 기본값. OOM이면 자동으로 절반씩 줄인다.

parse:
  # TITLE 텍스트가 하나라도 맞으면 그 섹션(하위 포함)을 제외한다. 섹션 제목을 하드코딩하지 않는다.
  exclude_title_patterns:
    - '^목\s*차$'
    - '대표이사\s*등의\s*확인'
    - '^(\d+(-\d+)?\.\s*)?(별도\s*)?재무제표(\s*주석)?$'
    - '별도\s*재무제표'
    - '\(\s*별도\s*\)$'
  # 원문 정리(sanitize_xml) 후에도 남는 XML 복구 오류 허용 수. 넘으면 그 문서를 실패로 남긴다(조용히 적재하지 않음).
  max_recover_errors: 0

chunk:
  target_tokens: 700
  overlap_tokens: 100
  max_tokens: 1000
  # 표 바로 위의 짧은 문단(제목·단위)을 표 청크로 가져온다.
  caption_max_chars: 100
  caption_max_blocks: 4

load:
  commit_every: 256

search:
  final_k: 10
  candidate_k: 50
  exact: true        # 평가는 반드시 true (HNSW 미사용 정확 검색)
  ef_search: 200     # exact=false일 때 hnsw.ef_search
  weights:           # 실제 검색 기본값: dense / sparse / ColBERT = 4 / 2 / 4
    dense: 0.4
    sparse: 0.2
    colbert: 0.4

colbert:
  cache_max_mb: 2048
