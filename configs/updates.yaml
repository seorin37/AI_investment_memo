# AI 업데이트 파이프라인 설정. 임계값은 experiment 결과(유사도 분포)를 보고 조정한다 (아래 값은 임시).
news:
  variant: hybrid            # news_embedding_variants.variant (dense | hybrid). 둘 다 dense 벡터로 검색한다
  lookback_days: 30
  top_k: 8
disclosure:
  top_k: 4
price:
  near_pct: 3.0              # 조건가까지 남은 거리가 조건가의 이 % 이내면 '가까워짐'
# 최신순 하향식 검색 (experiment): 이 기간 안에서 임계값을 넘은 후보를 날짜 최신순으로 fetch_k건 가져온다.
# news.lookback_days / top_k, disclosure.top_k는 noise_floor(유사도순 검색)가 쓴다.
recent:
  lookback_days: 365         # 오늘부터 이 날수만큼 거슬러 간다. 그 안에 없으면 카드를 만들지 않는다
  fetch_k: 50                # 종류별로 DB에서 가져오는 최대 후보 수
topic:
  min_similarity: 0.5        # 종류별 값이 없을 때 쓰는 기본 임계값
  # 2026-11-05 최신순 하향식 비교(updates_t1~t4) 중 조합 ③ 엄격을 채택. 형식적 공시 근거 0건, 붙은 근거의 관련성이 가장 높았다
  min_similarity_news: 0.58
  min_similarity_disclosure: 0.64
  strong_similarity_news: 0.63       # 날짜를 거슬러 가다 이 이상인 후보가 나오면 그 날짜에서 멈춘다
  strong_similarity_disclosure: 0.68 # 끝까지 없으면 lookback_days 전체에서 유사도 높은 순으로 고른다
  max_disclosure_evidence: 2
  max_news_evidence: 3
  related_news_min_similarity: 0.6   # 공시 카드에 링크로 덧붙이는 관련 기사의 최소 유사도 (LLM이 문장으로 쓰지 않은 기사, 임시값)
  news_dup_similarity: 0.7   # 이 이상 비슷한 제목의 기사는 하나로 묶는다 (임시: 글자 이중쌍 유사도)
  max_text_chars_news: 600
  max_text_chars_disclosure: 800
  format_retry: 1            # 제목·문장 길이만 어겼을 때 고쳐 달라고 다시 요청하는 횟수 (0이면 끔). 숫자·출처·금지어 위반은 다시 요청하지 않는다
  on_check_fail: drop        # fixed(고정 문구 카드로 대체, 지침서) | drop(카드를 만들지 않음)
  # 2026-11-05 다른 회사 기사의 실적을 추적 종목의 것처럼 쓴 카드(파트론 → 삼성전자)가 코드 검사를 통과해 켰다
  verify_call: true          # 코드 검사를 통과한 카드를 LLM이 문장별로 근거와 다시 대조한다 (통과 카드당 호출 +1)
  title_max: 30              # 2026-11-05 20 → 30: 종목명이 들어가면 20자를 쉽게 넘어 내용이 괜찮은 카드도 버려졌다
  max_sentences: 3
  sentence_max_chars: 60
  min_confidence: 0.7
  min_fact_overlap: 0.6
  reason_max: 80
  fact_max: 100
  max_evidence: 3
  # 시제 패턴: 예측·단정 표현. 회사 발언을 전한 문장("~라고 밝혔어요")에는 적용하지 않는다 (checks.ATTRIBUTION)
  banned_patterns:
    - '(오를|내릴|올라갈|떨어질|상승할|하락할|회복될|반등할)\s*(거|것|가능성|전망|듯)'
    - '가능성이?\s*(높|큽|커)'
    - '(할|될)\s*전망'
    # 주체 없이 전망·예상을 전한 문장 ("매출은 3조원으로 전망돼요"). "KB증권은 ~로 전망했어요"처럼 주체를 쓴 문장은 걸리지 않는다
    - '(전망|예상|추정|관측)(돼요|되어요|됩니다|돼|이에요|입니다)'
    - '것으로\s*(보여요|보입니다|보인다)'
# 금지 표현 사전: 지침서 3-3 초기 사전 (부분 문자열 일치). 시제 패턴은 위 topic.banned_patterns.
# "매수", "매도" 단독은 넣지 않았다: 자사주 매수·지분 매도 같은 공시 사실을 막기 때문.
banned:
  [사세요, 파세요, 매수 기회, 매도 기회, 담을 때, 손절하세요, 오를 거, 상승할 가능성, 회복될 전망, 호재, 악재,
   긍정적, 부정적, 저평가, 고평가, 유망, 유리, 불리, 확실히, 반드시, 틀림없이]