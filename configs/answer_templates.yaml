# LLM 없이 만드는 고정 문구 — 지침서 Ⅳ-1, Ⅴ-2
# {이름} 자리는 코드가 채운다. 숫자는 코드가 계산·포맷한 값을 넣는다.

# 업데이트 카드: 검사에서 LLM 답변을 버렸거나 호출이 실패했을 때
update_fallback:
  disclosure:
    title: "새 공시"
    summary: "새 공시가 올라왔어요: {report_name} ({rcept_date})"
  financials:
    title: "{period} 실적 공개"
    summary: "{period} 실적이 공개됐어요: 매출 {revenue} (전년 같은 기간 대비 {revenue_yoy})"
  news:
    title: "관련 기사"
    summary: "관련 기사가 있어요: {news_title} · {publisher} ({published_at})"

# 가격 조건 카드: 상태가 바뀔 때만 만든다 (away → near, near → reached)
price_condition:
  near:
    title: "{threshold}에 가까워짐"
    summary: "{threshold}에 가까워졌어요 ({trade_date} 종가 {close}, {gap_pct}% 남음)"
  reached:
    title: "{threshold} 도달"
    summary: "{threshold}에 도달했어요 ({trade_date} 종가 {close} 기준)"

# 즉시 답변
memo_answer:
  price: "{trade_date} 종가는 {close}이에요 (실시간 아님)"
  price_change: "{start_date}부터 {end_date}까지 종가가 {change_pct} 바뀌었어요 ({start_close} → {end_close})"
  financial_value: "{period} {metric}은 {value}이에요 ({fs_div}, {report_name})"
  out_of_policy: "매수·매도 판단은 드리지 않아요. 관련 공시와 실적 변화를 계속 알려 드릴게요."
  prediction: "앞으로의 주가는 예측하지 않아요. 관련 변화가 생기면 알려 드릴게요."
  cannot_answer: "지금 가진 자료로는 답하기 어려워요."

# 화면 하단 고정 문구 (LLM 답변에 넣지 않는다)
disclaimer: "이 정보는 투자 권유가 아니며, 투자 판단의 책임은 본인에게 있습니다."
