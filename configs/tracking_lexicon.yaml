# 정제: 이 말로 시작하는 어절은 판정용 사본에서 지운다 (원문은 그대로).
profanity_stems: [씨발, 시발, 씨바, 시바, ㅅㅂ, ㅆㅂ, ㅅ1ㅂ, 씹, 좆, 존나, 졸라, 개새, 개같, 개빡, 개XX, XX, 병신, ㅂㅅ, 염병, 지랄, ㅈㄹ, 미친, 쓰레기]
# 욕설 앞에 붙는 강조 접두사: "개씨발", "개쓰레기", "존나씨발"도 욕설로 본다

profanity_prefixes: [개, 존나, 졸라]

# 정제: 이 어절은 지운다 (부르는 말).
vocatives: [클코야, 클코, 클로드야, 클로드, AI야, ai야, 에이아이야, 봇아, 챗봇아, 야]

# 의미 없음 판정: 정제 후 이 말과 기호만 남으면 B7.
filler_words: [진짜, 정말, 레알, ㄹㅇ, ㅇㅇ, ㅇㅋ, ㄱㄱ, ㄴㄴ, 아, 아니, 하, 음, 헐, 와, 흠, 에휴, 후, 근데, 그냥]

# 광고·스팸: 강한 표현은 하나만 있어도, 약한 표현은 링크와 함께 있으면 B6.
spam_strong: [리딩방, 무료입장, 무료 입장, 고수익, 수익 보장, 수익보장, 원금 보장, 원금보장, 급등주 추천]
spam_with_link: [오픈채팅, 오픈 채팅, 카톡방, 텔레그램, 무료, 문의, 가입]

# 범위 밖: 이 말이 있고, 종목 별칭과 금융 단어가 하나도 없으면 B5.
out_of_scope: [날씨, 비트코인, 코인, 이더리움, 부동산, 아파트, 병원, 건강, 무릎, 운동, 다이어트, 연애, 여행, 점심, 저녁, 커피]
# 도메인 단어 사전 (공시 청크에서 만든 금융·산업 단어, pipelines.tracking.domain으로 재생성)
# 종목명·도메인 단어·요청 표지가 하나도 없는 짧은 문장은 API 없이 범위 밖(B5)으로 본다.
domain_vocab: configs/tracking_domain_vocab.txt.gz
# 이런 말이 있으면 사용자가 무언가를 원하는 문장이라 도메인 사전 규칙을 적용하지 않는다
# "뭐"는 일상 말(뭐하냐·뭐 먹지)에 너무 흔해 넣지 않는다 (WO-031)
# 대명사(이거·그거)도 넣는다 — 앞 문장을 가리키는 말이라 버리면 안 된다 ("…알려줘 이거 중요함")
intent_markers: [왜, 언제, 얼마, 어떻게, 어케, 궁금, ㄹㅇ, "진짜?", 체크, 확인, 보기, 봐, 알려, 추적, 이거, 그거, 저거, 이것, 그것, 저것]
finance_words: [실적, 매출, 영업이익, 이익, 주가, 수요, 공급, 업황, 반도체, 메모리, 배당, 주주환원, 자사주, 공시, 수주, 점유율, 금리, 환율, 규제, 소송, 투자, 증설, 가격, 시장]

# 가격 조건
price:
  below: [밑으로, 밑, 아래로, 아래, 깨지면, 깨지, 이하로, 이하, 떨어지면, 빠지면, 내려가면]
  above: [넘으면, 넘어가면, 넘어서면, 넘기면, 위로, 돌파, 이상, 뚫으면, 뚫리면, 회복]
  conditional: [면, 시, 때]
  # 조건 뒤에 이런 말이 오면 사용자 본인 행동 → C1 (카드에 원문 메모로 표시)
  action_words: [손절, 팔, 매도, 매수, 사, 살, 줍, 모으, 정리, 차익, 익절, 들어가, 갈아타, 고민, 비중]
  # 조건 뒤에 이런 말만 오면 단순 알림 → A2
  notify_words: [알림, 알려줘, 알려주세요, 알려, 체크, 확인]
