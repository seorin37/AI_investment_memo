  "003490": {name: 대한항공, aliases: [대한항공]}
  "090430": {name: 아모레퍼시픽, aliases: [아모레퍼시픽, 아모레]}
  "034020": {name: 두산에너빌리티, aliases: [두산에너빌리티, 두산에너]}
