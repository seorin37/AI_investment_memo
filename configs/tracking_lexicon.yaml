  "051910": {name: LG화학, aliases: [LG화학, 엘지화학]}
  "006400": {name: 삼성SDI, aliases: [삼성SDI, 삼성에스디아이]}
  "028260": {name: 삼성물산, aliases: [삼성물산]}
