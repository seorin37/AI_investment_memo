# LLM 답변(업데이트 카드·즉시 답변) 코드 검사 설정 — 지침서 Ⅴ-1
# 하나라도 걸리면 그 답변은 버리고 answer_templates.yaml의 고정 문구로 바꾼다.
# 평가에서 새로 발견된 표현은 여기에 더한다. 코드 변경 없이 사전만 고쳐도 검사가 바뀐다.

limits:
  title_max_chars: 20
  sentence_max_chars: 60      # 근거 번호 [E1] 표시는 빼고 센다
  max_sentences: 3
  reason_max_sentences: 1
  min_confidence: 0.7

# 금지 표현 (정규식). 띄어쓰기 변형을 잡기 위해 \s*를 쓴다.
banned:
  recommend:                  # 매수·매도 권유, 시점 제안
    - 사세요
    - 파세요
    - 매수\s*(하세요|추천|기회|타이밍|적기)
    - 매도\s*(하세요|추천|타이밍|적기)
    - 담(을|기)\s*(때|만한|좋은)
    - (팔|살)\s*때
    - 기회(예요|입니다|일)
    - 추천(해요|합니다|드려요)
  predict:                    # 앞으로의 주가·실적 예측
    - (오를|내릴|떨어질|상승할|하락할|반등할|회복될|개선될|악화될)\s*(거|것|수|가능|전망|듯)
    - 전망(이에요|입니다|돼요|됩니다)
    - 기대(돼요|됩니다)
    - 이어질\s*(거|것|전망)
    - (할|될|질)\s*수\s*(있어요|있습니다|있을)   # "부진할 수 있어요" (과잉 차단 시 allow에 예외 추가)
    - 가능성
  evaluate:                   # 좋고 나쁨, 유리·불리 평가
    - 호재
    - 악재
    - 저평가
    - 고평가
    - 유망
    - 긍정적
    - 부정적
    - 우려
    - 아쉽
    - 유리(해요|합니다|한)
    - 불리(해요|합니다|한)
    - 빨간불
    - 청신호
    - 가설(이|은)\s*(맞|틀)
  assert:                     # 단정·보장
    - 확실(히|해요|합니다)
    - 반드시
    - 틀림없
    - 보장
  compare:                    # 종목 우열
    - 더\s*(싸|저렴|낫|좋)
    - (나아|좋아)\s*보여요

# 금지 표현이 들어 있어도 허용하는 경우 (먼저 지운 뒤 검사한다)
# 예: 회사가 밝힌 전망을 주어를 밝혀 옮긴 문장
allow:
  - 회사는\s*[^.]*\s*(전망|예상|기대)한다고\s*밝혔어요

# 숫자 대조: 답변의 숫자가 근거에 있는지 볼 때 같은 값으로 보는 단위
number_units:
  만: 10000
  억: 100000000
  조: 1000000000000
