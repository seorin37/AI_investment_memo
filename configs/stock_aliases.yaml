# 기사-종목 태그 확대 (backend/pipelines/news/stock_tagger.py, 2026-11-09). 이름 목록은 stocks 테이블(코스피) 이름 + 아래 별칭.
# 붙이는 기준: 제목에 나오면(score 1.0) / 본문 리드 200자 안에 1번(0.8) / 본문에 2번 이상(0.6). 본문 1번은 붙이지 않는다.
# 긴 이름 우선: DART 상장사 이름과 blockers가 더 길게 겹치면 짧은 이름은 세지 않는다 ("SK하이닉스" 안의 "SK", "ELS" 안의 "LS"는 영문 경계).

# 종목코드 → 별칭 (stocks 이름 말고 기사에서 쓰는 이름)
aliases:
  "005930": [삼전]
  "000660": [하이닉스, SK닉스]
  "035420": [네이버]
  "105560": [KB금융지주]
  "005380": [현대자동차]
  "000270": [기아차]
  "066570": [엘지전자]
  "051910": [엘지화학]
  "373220": [LG엔솔, LG에너지]
  "207940": [삼바, 삼성바이오]
  "017670": [SKT]
  "030200": [케이티]
  "093050": [LF몰]            # LF 자체 쇼핑몰 (짧은 이름 뒤 글자 규칙에 걸리지 않게)

# 짧은 이름을 가로막는 다른 이름 (상장사 목록에 없는 계열사·약칭·그룹 표현). 이 자리 안의 짧은 이름은 세지 않는다
blockers: [SK쉴더스, SK에코플랜트, SK온, SK엔무브, SK실트론, SK그룹, LG그룹, GS그룹, LS그룹, CJ그룹, 한화그룹, 두산그룹, 효성그룹,
           한진그룹, 삼성그룹, 현대차그룹, LG유플러스, LG헬로비전, 한화오션, 한화에어로스페이스, 한화솔루션, 한화생명, 한화손해보험,
           GS건설, GS리테일, LS일렉트릭, LS일렉, LS전선, LS머트리얼즈, CJ제일제당, CJ대한통운, CJ ENM, CJ CGV, 효성중공업, 효성티앤씨,
           한진칼, 두산에너빌리티, 두산밥캣, 두산로보틱스, 대상포진, 남성복, 남성용]

# 그룹 이름과 같은 지주사: 제목·리드에서만 붙이고, 뒤에 그룹을 뜻하는 말이 오면 붙이지 않는다
group_names: [SK, LG, GS, LS, CJ, 한화, 두산, 효성, 한진, 롯데지주, HD현대, 삼성물산]
group_suffixes: [그룹, 家, 계열, 일가, 오너, 총수, 회장, 측]

# 흔한 단어·지명과 같은 이름: 앞뒤 context_window자 안에 주식 관련 말(context_words)이 있을 때만 붙인다.
# 2글자 한글 이름은 short_ok에 없으면 모두 이 규칙을 탄다
require_context: [대상, 남성, 보령, 풍산, 대덕, 금양, 한섬, 무학, 화신, 한독, 삼립, 후성, 동원, 세방, 성안, 일신, 조광, 진원, 평화, 백광,
                  신흥, 동양, 대원, 서원, 삼화, 태양, 국보, 우진, 한일, 현대, SBS]   # SBS: 예능·드라마 기사
short_ok: [기아, 한화, 효성, 두산, 한진, 농심, 대웅, 쏘카, 하이브, 카카오]
# 2026-11-09 "상장" 뺌: "선정 대상 모수는 … 상장법인"이 통과했다
context_words: [주가, 주식, 주주, 실적, 영업이익, 영업익, 매출, 순이익, 공시, 지분, 대표, 회장, 사장, 투자, 인수, 계약, 수주, 목표가,
                증권, 코스피, 코스닥, 시가총액, 배당, 자사주, ㈜, (주), 그룹, 계열사, 신제품, 출시]
context_window: 30

# 스포츠 구단과 같은 이름: 앞뒤 context_window자 안에 경기 말이 있으면 붙이지 않는다 (2026-11-09 "두산 최민석", "SK-DB")
sports_names: [두산, DB, SK, LG, KT, 한화, 롯데지주, NC, KCC, 현대모비스, 삼성생명, 하나금융지주, 우리금융지주, 신한지주, KB금융, 한국전력, 대한항공]
sports_words: [프로야구, 야구, 농구, 배구, 축구, 감독, 선수, 경기, 리그, 구단, 타자, 투수, 득점, 시즌, KBO, KBL, KOVO, 우승, 플레이오프, 대표팀]
# 이 길이 이하 이름과 그룹 이름은 바로 뒤에 조사가 아닌 한글이 오면 붙이지 않는다 ("LS오토", "KCC실리콘", "기아대책")
prefix_check_max_len: 3
# 이 말이 든 이름은 제목에서만 붙인다 (본문의 "미래에셋증권에 따르면"은 기사 출처)
title_only_words: [증권]

# 본문 규칙(리드·2번 이상)으로 붙는 종목은 기사당 이만큼 (시황 기사가 수십 종목을 나열한다). 제목 규칙은 제한하지 않는다
max_body_tags: 5
lead_chars: 200
