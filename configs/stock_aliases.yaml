# 기사-종목 태그 확대 (backend/pipelines/news/stock_tagger.py, 2026-11-09). 이름 목록은 stocks 테이블(코스피) 이름 + 아래 별칭.
# 붙이는 기준: 제목에 나오면(score 1.0) / 본문 리드 200자 안에 1번(0.8) / 본문에 2번 이상(0.6). 본문 1번은 붙이지 않는다.
# 긴 이름 우선: DART 상장사 이름과 blockers가 더 길게 겹치면 짧은 이름은 세지 않는다 ("SK하이닉스" 안의 "SK", "ELS" 안의 "LS"는 영문 경계).

# 종목코드 → 별칭 (stocks 이름 말고 기사에서 쓰는 이름)
aliases:
  "005930": [삼전]
  "000660": [하이닉스, SK닉스, 하닉, SK하닉]   # 2026-11-09 하닉·SK하닉 추가
  "035420": [네이버]
  "105560": [KB금융지주]
  "005380": [현대자동차]
  "000270": [기아차]
  "066570": [엘지전자]
  "051910": [엘지화학]
  "373220": [LG엔솔, LG에너지]
  "207940": [삼바, 삼성바이오]
  "017670": [SKT]
  "030200": [케이티]
  "093050": [LF몰]            # LF 자체 쇼핑몰 (짧은 이름 뒤 글자 규칙에 걸리지 않게)
  "012450": [한화에어로]       # 2026-11-18 "한화에어로"가 지주사 한화로 붙었다
  "016610": [DB證, DB금융투자] # 2026-11-18 "DB證"이 DB로 붙었다

# 짧은 이름을 가로막는 다른 이름 (상장사 목록에 없는 계열사·약칭·그룹 표현). 이 자리 안의 짧은 이름은 세지 않는다
blockers: [SK쉴더스, SK에코플랜트, SK온, SK엔무브, SK실트론, SK그룹, LG그룹, GS그룹, LS그룹, CJ그룹, 한화그룹, 두산그룹, 효성그룹,
           한진그룹, 삼성그룹, 현대차그룹, LG유플러스, LG헬로비전, 한화오션, 한화에어로스페이스, 한화솔루션, 한화생명, 한화손해보험,
           GS건설, GS리테일, LS일렉트릭, LS일렉, LS전선, LS머트리얼즈, CJ제일제당, CJ대한통운, CJ ENM, CJ CGV, 효성중공업, 효성티앤씨,
           한진칼, 두산에너빌리티, 두산밥캣, 두산로보틱스, 대상포진, 남성복, 남성용, 영풍문고]   # 영풍문고 2026-11-18

# 그룹 이름과 같은 지주사: 제목·리드에서만 붙이고, 뒤에 그룹을 뜻하는 말이 오면 붙이지 않는다
group_names: [SK, LG, GS, LS, CJ, 한화, 두산, 효성, 한진, 롯데지주, HD현대, 삼성물산]
group_suffixes: [그룹, 家, 계열, 일가, 오너, 총수, 회장, 측]
# 2026-11-18 그룹 이야기 더 막기 (코스피 태깅 조사 표본):
# - 그룹 이름 뒤에 영문 대문자 낱말이 오면 비상장 계열사 ("LG CNS", "SK C&C")
# - "·"로 이은 그룹 나열 ("삼성·LG", "삼성·SK·LG그룹 등 주요 대기업")이나 나열 끝의 group_list_tail
group_list_words: [삼성, 현대차, 현대, 롯데, 포스코, 신세계, 카카오, 한화, 두산, SK, LG, GS, LS, CJ, HD현대, 효성, 한진]
group_list_tail: [그룹, 대기업, 재계, 총수, 오너]
# 그룹 이름 뒤(한 칸 띄어도)에 오면 계열사 제품·매장·시설 브랜드 ("LG 올레드 TV", "LG 베스트샵", "LG 사이니지", 2026-11-18)
group_product_words: [올레드, 그램, 사이니지, 베스트샵, 시그니처, 디오스, 휘센, 트롬, 스탠바이미, 퓨리케어, 코드제로, 매직, 아트센터, 사이언스파크, 트윈스]

# 흔한 단어·지명과 같은 이름: 앞뒤 context_window자 안에 주식 관련 말(context_words)이 있을 때만 붙인다.
# 2글자 한글 이름은 short_ok에 없으면 모두 이 규칙을 탄다
require_context: [대상, 남성, 보령, 풍산, 대덕, 금양, 한섬, 무학, 화신, 한독, 삼립, 후성, 동원, 세방, 성안, 일신, 조광, 진원, 평화, 백광,
                  신흥, 동양, 대원, 서원, 삼화, 태양, 국보, 우진, 한일, 현대, SBS]   # SBS: 예능·드라마 기사
short_ok: [기아, 한화, 효성, 두산, 한진, 농심, 대웅, 쏘카, 하이브, 카카오, 영풍]   # 영풍 2026-11-18 ("영풍·MBK 승소"가 빠졌다. 영풍문고는 blockers)
# 2026-11-09 "상장" 뺌: "선정 대상 모수는 … 상장법인"이 통과했다
context_words: [주가, 주식, 주주, 실적, 영업이익, 영업익, 매출, 순이익, 공시, 지분, 대표, 회장, 사장, 투자, 인수, 계약, 수주, 목표가,
                증권, 코스피, 코스닥, 시가총액, 배당, 자사주, ㈜, (주), 그룹, 계열사, 신제품, 출시]
context_window: 30          # 제목에서 앞뒤로 보는 글자 수
# 2026-11-18 리드·본문은 이름 바로 뒤 이 글자 수 안에 주식 낱말이 있거나, 바로 뒤 종목코드 "(001680)"·앞뒤 "㈜"가 있을 때만
# ("지원 대상도", "투자 대상이라고"처럼 앞에 온 낱말은 세지 않는다)
context_after_window: 10

# 스포츠 구단과 같은 이름: 앞뒤 context_window자 안에 경기 말이 있으면 붙이지 않는다 (2026-11-09 "두산 최민석", "SK-DB")
# 2026-11-18 기업은행·현대건설(배구), 한국가스공사(농구), 빙그레(옛 이글스) 추가
sports_names: [두산, DB, SK, LG, KT, 한화, 롯데지주, NC, KCC, 현대모비스, 삼성생명, 하나금융지주, 우리금융지주, 신한지주, KB금융, 한국전력, 대한항공,
               기업은행, 현대건설, 한국가스공사, 빙그레]
# 정규식. "경기"·"감독"은 경기·감독을 뜻하는 꼴만 ("경기 남양주"·"경기 침체"·"금융감독원"은 아니다) (2026-11-18 쿼터·연승·세트·FA·체육관 등 추가)
sports_words: [프로야구, 야구, 농구, 배구, 축구, '감독(?:이|은|을|의|과|대행|으로|직|님|이었|에게)', 선수, '경기(?:에서|를|서|중|후|끝|결과|시작|일정)',
               리그, 구단, 타자, 투수, 득점, 시즌, KBO, KBL, KOVO, 우승, 플레이오프, 대표팀,
               쿼터, 연승, 연패, 세트 점수, 'FA\b', 체육관, 이글스, 코치, 야구부, 전적, 홈경기, 원정,
               남자부, 여자부, V리그, 트윈스, 베어스, 랜더스, 타이거즈, 위즈, 히어로즈, 라이온즈, 다이노스, 자이언츠, 점보스,
               스카이워커스, 빅스톰]   # 구단 별칭 ("LG 트윈스")
# 이름 바로 뒤에 붙으면 다른 기관·시설로 본다 ("한국공항공사", "한국석유공사", "IBK기업은행챔버홀"). 숫자가 바로 붙어도 ("이마트24")
name_suffix_block: [공사, 공단, 챔버홀, 아트홀, 아트센터, 연구원, 배구단, 농구단, 야구단, 이글스, 점보스, 재단]   # 아트센터·연구원 2026-11-18
# 한 칸 띄고 오는 시설 이름 ("IBK기업은행 챔버홀", "LG 시그니처홀"). "센터"처럼 넓은 말은 넣지 않는다 ("KT 데이터센터"는 KT 소식)
spaced_suffix_block: [챔버홀, 아트홀, 시그니처홀, 콘서트홀, 아트센터, 배구단, 농구단, 야구단]
# 이 길이 이하 이름과 그룹 이름은 바로 뒤에 조사가 아닌 한글이 오면 붙이지 않는다 ("LS오토", "KCC실리콘", "기아대책")
prefix_check_max_len: 3
# 이 말이 든 이름은 제목에서만 붙인다 (본문의 "미래에셋증권에 따르면"은 기사 출처)
title_only_words: [증권]
# 이 이름은 제목에서 붙이고, 본문에서는 바로 뒤 context_after_window자 안에 주식 낱말·종목코드가 있을 때만 붙인다
# (본문의 "네이버"는 포털·검색 서비스가 대부분. 4종목 RSS 태거 stocks.yaml의 title_only를 옮김. 2026-11-18 "네이버(035420)" 허용)
title_only_names: [네이버, NAVER]
# 이 제목의 기사는 태그를 붙이지 않는다 (인사·부고 기사는 계열사를 여러 개 나열한다)
# 2026-11-18 [게시판] 뺌: "[게시판] SK케미칼, ESG 평가 A+"처럼 회사 소식이 빠졌다
skip_title_patterns: ['\[(인사|부고|동정)\]', '^\s*(인사|부고)\s*[:：]']

# 본문 규칙(리드·2번 이상)으로 붙는 종목은 기사당 이만큼 (시황 기사가 수십 종목을 나열한다). 제목 규칙은 제한하지 않는다
max_body_tags: 5
lead_chars: 200
