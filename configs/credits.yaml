# 크레딧 규칙 (2026-11-20, 0019 credit_grants·credit_ledger). 숫자는 임시값 — 팀 결정 후 이 파일만 바꾸면 된다.
# 기간: 매달 1일 0시(한국 시간)에 기본량을 새로 지급하고, 지난달 기본량은 그때 만료된다. 산 크레딧은 다음 달로 넘어간다.
costs:                 # 결과물 하나당 차감량. 만들어졌을 때만 차감한다 (소식이 없어 카드가 안 나온 날은 0)
  card: 1              # 공시·뉴스 알림 카드
  answer: 1            # 메모 질문 답 (답을 못 찾은 '확인되지 않았어요'도 1)
  price_condition: 0   # 가격 조건 카드: LLM 없이 코드가 종가만 비교해서 무료
  report: 5            # 주간보고서 (스튜디오, 아직 생성 기능 없음)
  audio: 5             # AI 오디오
  lab: 3               # 투자 실험실
monthly:               # 요금제별 한 달 기본량. plan_limits.monthly_credits가 0보다 크면 그 값을 쓴다 (DB 값이 우선)
  free: 30
  pro: 300
purchase_valid_days: 365   # 산 크레딧 유효기간 (일). 0이면 만료 없음
