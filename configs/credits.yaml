# 크레딧·요금제 규칙. 요금제 숫자는 이 파일 한 곳에서 관리한다 (2026-11-25 팀 확정안 ⑧, docs/pricing-proposal.html).
# - 서버: 월 기본량 지급(ledger.monthly_amount), 차감(costs), 추적 항목 상한(app/credits/plans.py)
# - 화면: GET /api/v1/plans 로 가격·혜택·추가 크레딧 상품을 받아 요금제·충전 화면을 그린다
# 기간: 사용자마다 처음 기본량을 받은 날부터 한 달 주기(ledger.user_period). 갱신일에 지난 기본량은 만료되고 산 크레딧은 넘어간다.
costs:                 # 결과물 하나당 차감량. 만들어졌을 때만 차감한다 (소식이 없어 카드가 안 나온 날은 0)
  card: 1              # 공시·뉴스 알림 카드
  answer: 1            # 메모 질문 답
  answer_unverified: 0 # 답을 찾지 못한 '확인되지 않았어요' 답 (2026-11-25: 차감하지 않음)
  price_condition: 0   # 가격 조건 카드: LLM 없이 코드가 종가만 비교해서 무료
  report: 3            # 주간보고서
  audio: 5             # AI 오디오
  lab: 1               # 투자 실험실
monthly:               # 요금제별 한 달 기본량. plan_limits.monthly_credits가 0보다 크면 그 값을 쓴다 (DB 값이 우선)
  free: 20
  plus: 80
  pro: 160
tracking_items:        # 요금제별 동시에 켤 수 있는 AI 추적 항목 수 (이 값만 쓴다. plan_limits의 옛 시드 값은 쓰지 않음). 새로 켤 때만 막는다
  free: 5
  plus: 30
  pro: 100
purchase_valid_days: 365   # 산 크레딧 유효기간 (일). 0이면 만료 없음

# 화면에 보여 줄 요금제 (가격은 부가세 포함, 웹·앱 같은 가격). 결제는 아직 연결되지 않았다.
plans:
  - code: free
    name: 무료
    price: 0
    first_month_price: null
    summary: 메모 몇 개로 AI 추적을 시작해요
  - code: plus
    name: PLUS
    price: 14900
    first_month_price: 7450
    summary: 메모를 꾸준히 쓰고 주간보고서도 보는 분께
    recommended: true
  - code: pro
    name: PRO
    price: 29900
    first_month_price: 14950
    summary: 종목이 많고 스튜디오를 자주 쓰는 분께
credit_packs:          # 추가 크레딧 (모든 요금제 같은 값, 2026-11-25 9,900원 확정)
  - credits: 50
    price: 9900
